<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="icon" type="image/png" href="../images/favicon-asleep.png">
    <!-- custom styles -->
    <link href="style.css" rel="stylesheet"></link>
    <!-- load Fredoka and inter from fonts.google.com -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Adafruit IO custom library -->
    <script src="https://cdn.jsdelivr.net/gh/methio/adafruitIO-class@latest/index.js"></script>
    <!-- script custom -->
    <script src="script.js" defer></script>
   
</head>
<body>

    <div id="asleep" class="flex flex-column align-end">
        <h1>Nap time</h1>
        <img alt="reiko-asleep" src="../images/sleep.png" class="full-width sticker-effect">
    </div>

    <div id="awake" class="flex flex-column">
        <div id="awake-header" class="flex flex-row">
            <h1>It's time to go for a walk!</h1>
            <img alt="reiko awake" src="../images/awake.png" class="sticker-effect">
        </div>
        <div id="awake-content" class="flex flex-column">
            <h2 id="currentTime">00:00</h2>
            <h3>Ideas for walks</h3>
            <div id="cards-container" class="flex flex-row small-gap">
                <!-- filled dynamically from JS-->
            </div>
        </div>        
    </div>
    <!-- lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</body>
</html>
